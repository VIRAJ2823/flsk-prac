<!DOCTYPE html>
<html>

<head>
    <title>Register</title>
</head>

<body>

    <h1>Register</h1>

    <form action="/register" method="POST">

        <label>Username</label><br>
        <input type="text"
               name="username"
               placeholder="Enter Username"
               required>

        <br><br>

        <label>Password</label><br>
        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

</body>

</html>
