{% extends "base.html" %}
{% block title %}Login page{% endblock %}

{% block content %}
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul class="flashes">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}
<form action = "#" method ="post">
    <p>Name:</p>
    <p><input type = "text" name="nm"></p>
    <p><input type = "submit" value = "submit "></p>
</form>
{% endblock  %}
