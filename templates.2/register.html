<h1>Register</h1>

<form method="POST">

    {{ form.hidden_tag() }}

    {{ form.username.label }}<br>
    {{ form.username() }}

    {% for error in form.username.errors %}
        <p>{{ error }}</p>
    {% endfor %}

    <br><br>

    {{ form.password.label }}<br>
    {{ form.password() }}

    {% for error in form.password.errors %}
        <p>{{ error }}</p>
    {% endfor %}

    <br><br>

    {{ form.submit() }}

</form>
